name: NextViper Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev libpq-dev vulkan-tools

      - name: Compile NextViper
        run: |
          make -j$(nproc)
          make test

      - name: Package Linux Binary Artifacts
        run: |
          mkdir -p dist/nextviper-linux-x86_64
          cp bin/nextviper dist/nextviper-linux-x86_64/
          cp bin/nextviper-lsp dist/nextviper-linux-x86_64/
          cp README.md LICENSE dist/nextviper-linux-x86_64/ || true
          tar -czvf nextviper-linux-x86_64.tar.gz -C dist nextviper-linux-x86_64
          sha256sum nextviper-linux-x86_64.tar.gz > nextviper-linux-x86_64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            nextviper-linux-x86_64.tar.gz
            nextviper-linux-x86_64.tar.gz.sha256

  build-linux-aarch64:
    name: Build Linux aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libvulkan-dev libpq-dev

      - name: Compile NextViper
        run: |
          make -j$(nproc)
          make test

      - name: Package Linux ARM64 Binary Artifacts
        run: |
          mkdir -p dist/nextviper-linux-aarch64
          cp bin/nextviper dist/nextviper-linux-aarch64/
          cp bin/nextviper-lsp dist/nextviper-linux-aarch64/
          tar -czvf nextviper-linux-aarch64.tar.gz -C dist nextviper-linux-aarch64
          sha256sum nextviper-linux-aarch64.tar.gz > nextviper-linux-aarch64.tar.gz.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: |
            nextviper-linux-aarch64.tar.gz
            nextviper-linux-aarch64.tar.gz.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
