name: NextViper Release Pipeline
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nextviper
          POSTGRES_PASSWORD: nextviper-ci-only
          POSTGRES_DB: nextviper_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nextviper -d nextviper_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXTVIPER_TEST_DATABASE_URL: postgresql://nextviper:nextviper-ci-only@127.0.0.1:5432/nextviper_test?connect_timeout=5
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libvulkan-dev libpq-dev libcurl4-openssl-dev python3 curl openssl
      - name: Build and validate
        run: |
          make -j2 test
          python3 tests/native_verify/run_all.py
      - name: Package and test installation
        env:
          NEXTVIPER_SKIP_BUILD: '1'
        run: |
          version=1.0.0-preview
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          bash scripts/package_release.sh "$version"
          python3 tests/test_distribution.py --archive dist/nextviper-v${version}-linux-$(uname -m).tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
  publish-release:
    needs: [build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
          draft: true
          prerelease: true
          generate_release_notes: true
